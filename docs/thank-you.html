<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for reaching out — CTO KINGMAN KE">
    <meta name="theme-color" content="#0a0f14">
    <title>Thank You | CTO KINGMAN KE</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" href="https://i.ibb.co/6cy5dh9T/kdcn-logo.png" type="image/png">
    <style>
        .thank-you { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 130px 5% 80px; }
        .thank-you-content { max-width: 620px; }
        .thank-icon { width: 90px; height: 90px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--accent); border-radius: 50%; color: var(--accent); font-size: 3rem; background: rgba(0,209,255,0.06); }
        .thank-you h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 16px; }
        .thank-you h1 span { background: linear-gradient(90deg, var(--accent), var(--primary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .thank-you p { color: var(--muted); margin-bottom: 32px; font-size: 1.05rem; }
        .thank-you .actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    </style>
</head>
<body>
    <nav class="site-nav" id="site-nav">
        <div class="nav-container">
            <a href="index.html" class="brand" aria-label="CTO KINGMAN KE Home">
                <img src="https://i.ibb.co/6cy5dh9T/kdcn-logo.png" alt="KDCN Logo" class="brand-logo">
                <span class="brand-text">CTO KINGMAN KE</span>
            </a>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark and light theme">🌙</button>
                <button class="hamburger" id="hamburger" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-menu">
                    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                </button>
            </div>
        </div>
    </nav>

    <main class="thank-you">
        <div class="thank-you-content">
            <div class="thank-icon">✓</div>
            <h1>Thank You for <span>Reaching Out</span></h1>
            <p>Your message has been received. I'll get back to you as soon as possible to discuss your project, organization, or inquiry.</p>
            <div class="actions">
                <a href="index.html" class="btn btn-primary">Back to Home</a>
                <a href="about.html" class="btn btn-secondary">Learn More</a>
            </div>
        </div>
    </main>

    <script src="assets/script.js"></script>
</body>
</html>
