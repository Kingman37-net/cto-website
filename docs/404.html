<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | CTO KINGMAN KE</title>

    <meta name="description"
          content="The requested page could not be found on the CTO KINGMAN KE website.">

    <meta name="robots"
          content="noindex, nofollow">

    <link rel="icon"
          href="https://media.kingmandigital.co.ke/website/cto/logo/kdcn-logo-500.webp"
          type="image/webp">

    <link rel="stylesheet"
          href="/assets/style.css">

    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 5% 60px;
        }

        .not-found-inner {
            max-width: 760px;
        }

        .not-found h1 {
            font-size: clamp(5rem, 18vw, 10rem);
            font-weight: 800;
            line-height: 0.9;
            background: linear-gradient(
                90deg,
                var(--accent),
                var(--primary)
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 24px;
        }

        .not-found h2 {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            margin-bottom: 16px;
            color: var(--light);
        }

        .not-found p {
            color: var(--muted);
            margin-bottom: 32px;
            font-size: 1.05rem;
        }

        .not-found .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .not-found .actions {
                flex-direction: column;
            }

            .not-found .btn {
                width: 100%;
            }
        }
    </style>

    <script>
        /*
         * Redirect legacy .html URLs to the current
         * folder-based URL structure while preserving
         * query strings and hash fragments.
         */
        (function () {
            const path = window.location.pathname;

            if (
                path.endsWith(".html") &&
                !path.endsWith("/404.html")
            ) {
                const newPath = path.replace(/\.html$/, "/");
                const query = window.location.search;
                const hash = window.location.hash;

                window.location.replace(
                    newPath + query + hash
                );
            }
        })();
    </script>
</head>

<body>

    <nav class="site-nav" id="site-nav">

        <div class="nav-container">

            <a href="/"
               class="brand"
               aria-label="CTO KINGMAN KE Home">

                <img
                    src="https://media.kingmandigital.co.ke/website/cto/logo/kdcn-logo-500.webp"
                    alt="KDCN Logo"
                    class="brand-logo"
                    width="500"
                    height="500"
                    loading="lazy"
                    decoding="async">

                <span class="brand-text">
                    CTO KINGMAN KE
                </span>

            </a>


            <ul class="nav-menu" id="nav-menu">

                <li>
                    <a href="/">
                        Home
                    </a>
                </li>

                <li>
                    <a href="/about/">
                        About
                    </a>
                </li>

                <li>
                    <a href="/work/">
                        Work
                    </a>
                </li>

                <li>
                    <a href="/journal/">
                        Journal
                    </a>
                </li>

                <li>
                    <a href="/resources/">
                        Resources
                    </a>
                </li>

                <li>
                    <a href="/contact/">
                        Contact
                    </a>
                </li>

            </ul>


            <div class="nav-actions">

                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    type="button"
                    aria-label="Toggle dark and light theme">
                    🌙
                </button>

                <button
                    class="hamburger"
                    id="hamburger"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="nav-menu">

                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>

                </button>

            </div>

        </div>

    </nav>


    <main class="not-found">

        <div class="not-found-inner">

            <p class="section-label">
                PAGE NOT FOUND
            </p>

            <h1>
                404
            </h1>

            <h2>
                The page you're looking for could not be found.
            </h2>

            <p>
                It may have been moved, removed, or the address may
                have been entered incorrectly.
            </p>

            <div class="actions">

                <a
                    href="/"
                    class="btn btn-primary">
                    Return Home
                </a>

                <a
                    href="/work/"
                    class="btn btn-secondary">
                    View My Work
                </a>

                <a
                    href="/contact/"
                    class="btn btn-secondary">
                    Contact Me
                </a>

            </div>

        </div>

    </main>


    <script src="/assets/script.js"></script>

</body>
</html>
